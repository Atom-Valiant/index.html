<!DOCTYPE html>
<html>
<head>
    <title>Number Guessing Game</title>
</head>
<body>
    <h1>Guess the Number (1-100)</h1>
    <input type="number" id="userGuess" placeholder="Enter your guess">
    <button onclick="checkGuess()">Check Guess</button>
    <p id="message"></p> 
    
    <p>
    <button onclick="resetGame()" id="resetGame">Reset Game</button> 
    </p>
    <script>

    
        // Generate random number between 1 and 100
        const randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
         

        function checkGuess() {
            const userGuess = parseInt(document.getElementById("userGuess").value);
            const messageEl = document.getElementById("message");
            attempts++;

            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                messageEl.textContent = "Please enter a valid number between 1 and 100.";
            } else if (userGuess === randomNumber) {
                messageEl.textContent = `Congratulations! You guessed it in ${attempts} attempts.`;
                // Disable input after win
                document.getElementById("userGuess").disabled = true;
            
            } else if (userGuess < randomNumber) {
                messageEl.textContent = "Too low! Try again.";
            } else {
                messageEl.textContent = "Too high! Try again.";
            }

            function resetGame() {
       
        document.getElementById("userGuess").disabled = false;
            }
        }
    </script>
</body>
</html>
